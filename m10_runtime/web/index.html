<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M10 控制台</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18382e;background:#f4f3eb}*{box-sizing:border-box}body{margin:0 auto;max-width:1180px;padding:28px}h1{font-size:36px;margin:0}h2{font-size:20px;margin:0 0 16px}p{line-height:1.65}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}a{color:inherit}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #ced5cb}button{background:#183c31;color:white;cursor:pointer;touch-action:none}button:disabled{opacity:.5;cursor:default}button.secondary{background:white;color:#183c31}.danger{background:#9b2c31}input{max-width:100%;background:white}section{background:white;border:1px solid #d9dfd4;border-radius:18px;padding:22px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair{display:flex;gap:10px;flex-wrap:wrap}.pair input{flex:1;min-width:200px}.pad{display:grid;grid-template-columns:repeat(3,82px);gap:10px;justify-content:center;margin:20px auto}.pad button{height:70px;font-size:24px;user-select:none}.status{white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:240px;overflow:auto;background:#f4f5f0;padding:14px;border-radius:10px}iframe{width:100%;height:260px;border:0;background:#000;border-radius:12px}video{width:100%;max-height:420px;background:#111;border-radius:12px}.hint{color:#5c6c63;font-size:14px}.faces{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.faces button{font-size:13px;padding:9px}.note{color:#9b2c31;min-height:24px}#mode{display:inline-block;padding:5px 10px;border-radius:20px;background:#e5eddf;font-size:14px}label{display:block;margin:12px 0}@media(max-width:760px){body{padding:16px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}h1{font-size:30px}}
</style>
<header><div><h1>M10 控制台</h1><p id="mode">正在连接服务</p></div><a href="/dreamupers">打开 Dreamupers 遥控页 ↗</a></header>
<section><h2>连接设备</h2><form class="pair" id="pair-form"><input id="token" type="password" autocomplete="off" placeholder="粘贴启动终端中的配对码" aria-label="配对码"><button>连接</button></form><p class="note" id="message" role="status"></p></section>
<div class="grid">
<section><h2>移动</h2><p class="hint">按住移动，松开停车。演示模式只显示模拟目标，不驱动硬件。</p>
<div class="pad"><span></span><button data-action="forward" aria-label="前进">↑</button><span></span><button data-action="left" aria-label="左转">←</button><button id="stop" class="secondary" aria-label="停车">■</button><button data-action="right" aria-label="右转">→</button><span></span><button data-action="backward" aria-label="后退">↓</button></div>
<label>速度 <input id="speed" type="range" min="1" max="60" value="20"> <span id="speed-label">20%</span></label>
<button id="emergency" class="danger">急停</button> <button id="clear" class="secondary">解除急停</button> <button id="reconnect" class="secondary">重新连接驱动</button>
<p class="hint">缺失硬件、未启用驱动或急停锁存时拒绝移动。人工遥控尚未接入自动避障。</p></section>
<section><h2>表情</h2><iframe src="/face" title="M10 表情" allow="autoplay"></iframe><div class="faces" id="faces"></div></section>
</div>
<section><h2>摄像头预览</h2><p class="hint">使用启动参数 --stream 启用图传。只有收到实际输出后才显示预览可用。</p><button id="stream-start">启动图传</button> <button id="stream-stop" class="secondary">停止图传</button><p id="stream-message" class="hint"></p><video id="preview" controls autoplay muted playsinline hidden></video></section>
<section><h2>设备状态</h2><p class="hint">当前统一入口提供遥控、表情与图传；连续目标跟踪仍在独立视觉工程中开发。</p><pre id="status" class="status">连接后显示实际运行状态。</pre></section>
<script src="/console.js"></script>
</html>
