<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M10 Vision</title><style>
body{font-family:system-ui;background:#101418;color:#eef2f5;margin:0;padding:24px}main{max-width:760px;margin:auto}.card{background:#1b2229;border:1px solid #33404b;border-radius:14px;padding:18px;margin:12px 0}button,input{font:inherit;padding:10px 12px;margin:4px;border-radius:8px;border:1px solid #52606c}button{background:#2878ff;color:white}.danger{background:#c83349}pre{white-space:pre-wrap}small{color:#9fb0bd}</style></head><body><main><h1>M10 Vision 控制台</h1><div class="card"><input id="token" placeholder="配对 token"><button onclick="refresh()">连接</button><small>token 仅保存在本浏览器会话</small></div><div class="card"><button onclick="act('search_pet')">寻找宠物</button><button onclick="act('search_owner')">寻找主人</button><button onclick="act('follow_pet')">跟随宠物</button><button onclick="act('stop')">停止</button><button class="danger" onclick="act('emergency_stop')">紧急停止</button></div><div class="card"><pre id="status">尚未连接</pre></div></main><script>
const h=()=>({'X-M10-Token':document.querySelector('#token').value});async function refresh(){let r=await fetch('/api/status',{headers:h()});document.querySelector('#status').textContent=JSON.stringify(await r.json(),null,2)}async function act(a){await fetch('/api/action/'+a,{method:'POST',headers:h()});refresh()}setInterval(()=>{if(document.querySelector('#token').value)refresh()},2000);
</script></body></html>
