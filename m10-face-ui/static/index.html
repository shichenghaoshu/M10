<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:," />
    <title>M10 Face</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main id="face-stage" aria-label="M10 表情屏">
      <video id="face-a" class="face-video active" muted playsinline loop preload="auto"></video>
      <video id="face-b" class="face-video" muted playsinline loop preload="auto"></video>
      <div id="boot-mark" aria-hidden="true"><i></i><i></i></div>
      <div id="connection-indicator" aria-hidden="true"></div>
    </main>

    <aside id="debug-panel" aria-label="表情调试面板">
      <header>
        <div><strong>M10 FACE</strong><span id="connection-label">连接中</span></div>
        <button id="close-debug" type="button" aria-label="关闭调试面板">×</button>
      </header>
      <div id="state-buttons"></div>
      <footer>
        <span id="current-label">—</span>
        <button id="fullscreen-button" type="button">全屏</button>
      </footer>
    </aside>

    <script src="/static/app.js" defer></script>
  </body>
</html>
